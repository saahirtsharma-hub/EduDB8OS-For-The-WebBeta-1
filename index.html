<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saahir OS Simulator</title><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body,html{width:100%;height:100%;overflow:hidden}.wallpaper{width:100vw;height:100vh;background:linear-gradient(90deg,#f50505 0,#1008f5 32%,#7a00ff 68%,#9e733b 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}#lock-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10vh;transition:opacity .35s ease,transform .35s ease;z-index:10}#lock-screen.hidden{opacity:0;pointer-events:none;transform:scale(1.03)}.clock{font-size:clamp(3.5rem,6vw,5.5rem);font-weight:700;color:#ff1e1e;letter-spacing:-1px;margin-bottom:18vh}.username{font-size:clamp(2rem,3.5vw,3rem);font-weight:700;color:#0c4;margin-bottom:24px}.password-box{width:220px;height:52px;border-radius:8px;background:linear-gradient(90deg,#e60000 0,#3b00b3 55%,#8c6239 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(0,0,0,.2);cursor:pointer;transition:transform .15s ease}.password-box:hover{transform:scale(1.03)}.password-input{width:100%;height:100%;background:0 0;border:none;outline:0;text-align:center;color:#fff;font-size:1rem;font-weight:500}.password-input::placeholder{color:#f0f0f0;opacity:.95}#desktop-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8vh;opacity:0;pointer-events:none;transition:opacity .35s ease}#desktop-screen.active{opacity:1;pointer-events:auto}.app-drawer{position:relative;width:220px;background-color:#ff2e1f;border-radius:10px;padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);transform-origin:bottom center;transform:scale(.85) translateY(20px);opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.2,.9,.3,1.1)}.app-drawer.open{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}.tile-group{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}.tier-1{gap:8px}.tier-1 .app-tile{width:40px;height:50px;border-radius:6px}.tier-2{gap:7px}.tier-2 .app-tile{width:32px;height:40px;border-radius:5px}.tier-3{gap:6px}.tier-3 .app-tile{width:24px;height:30px;border-radius:4px}.tier-4{gap:5px}.tier-4 .app-tile{width:15px;height:18px;border-radius:3px}.app-tile{background-color:#050505;cursor:pointer;transition:transform .15s ease,background-color .15s ease}.app-tile:hover{transform:scale(1.12);background-color:#222}.launcher-wrapper{position:relative;display:flex;flex-direction:column;align-items:center}.apps-btn{width:82px;height:92px;background-color:#ff2e1f;border:none;border-radius:10px;color:#00c;font-size:.95rem;font-weight:600;line-height:1.25;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:transform .15s ease}.apps-btn:hover{transform:scale(1.05)}.preview-card{position:absolute;left:38px;top:4px;width:165px;height:92px;border-radius:6px;background:linear-gradient(90deg,#1008f5 0,#7a00ff 55%,#9e733b 100%);box-shadow:0 8px 20px rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;padding-bottom:8px;z-index:20}.app-drawer.open~.launcher-wrapper .preview-card{display:flex}.preview-mini-btn{width:12px;height:12px;background-color:#ff2e1f;border-radius:2px}.badge-two{position:absolute;bottom:-28px;left:112px;width:22px;height:22px;border-radius:50%;background-color:rgba(20,20,20,.75);color:#4ade80;font-size:.75rem;font-weight:700;display:none;align-items:center;justify-content:center}.app-drawer.open~.launcher-wrapper .badge-two{display:flex}.app-window{position:fixed;top:15%;left:50%;transform:translateX(-50%);width:360px;background:rgba(18,18,24,.92);backdrop-filter:blur(12px);color:#fff;border-radius:12px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;z-index:50}.app-window.show{display:block}.window-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:10px;margin-bottom:14px}.close-win{background:#ff2e1f;border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:700}.lock-again{position:fixed;top:16px;right:16px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:6px;font-size:.8rem;cursor:pointer}</style></head><body><div class="wallpaper"><div id="lock-screen"><div class="clock" id="clock">9:41</div><div class="username">Saahir</div><div class="password-box" id="password-box"><input type="password" id="password-input" class="password-input" placeholder="Enter Password" aria-label="Enter Password"></div></div><div id="desktop-screen"><button class="lock-again" id="lock-btn">Lock</button><div class="app-drawer" id="app-drawer"><div class="tile-group tier-1" id="tier-1"></div><div class="tile-group tier-2" id="tier-2"></div><div class="tile-group tier-3" id="tier-3"></div><div class="tile-group tier-4" id="tier-4"></div></div><div class="launcher-wrapper"><button class="apps-btn" id="apps-btn"><span>APPS</span><span>Click</span><span>Here</span></button><div class="preview-card" title="Desktop Workspace 2"><div class="preview-mini-btn"></div></div><div class="badge-two">2</div></div></div><div class="app-window" id="app-window"><div class="window-header"><span id="window-title">App 1</span><button class="close-win" id="close-win">×</button></div><p id="window-body" style="font-size:.9rem;line-height:1.5;color:#ddd">Running inside Saahir OS Simulator.</p></div></div><script>const lockScreen=document.getElementById("lock-screen"),desktopScreen=document.getElementById("desktop-screen"),passwordBox=document.getElementById("password-box"),passwordInput=document.getElementById("password-input"),appsBtn=document.getElementById("apps-btn"),appDrawer=document.getElementById("app-drawer"),appWindow=document.getElementById("app-window"),windowTitle=document.getElementById("window-title"),windowBody=document.getElementById("window-body"),closeWin=document.getElementById("close-win"),lockBtn=document.getElementById("lock-btn"),appNames=["Terminal","Gemini AI","YouTube","Notes","App Store","Settings","Browser","Files","Calculator","Music","Photos","Mail","Calendar","Maps","Clock","Weather","Code Editor","System Monitor","Camera","Contacts","Messages","Reminders","Books","Podcasts","Utility 1","Utility 2","Utility 3","Utility 4","Utility 5","Utility 6","Utility 7","Utility 8"];let appIndex=0;["tier-1","tier-2","tier-3","tier-4"].forEach(e=>{const t=document.getElementById(e);for(let n=0;n<8;n++){const o=appIndex,s=appNames[o],a=document.createElement("div");a.className="app-tile",a.title=s,a.addEventListener("click",()=>{windowTitle.textContent=s,windowBody.textContent=`Launched ${s} (Slot #${o+1}) in Saahir OS.`,appWindow.classList.add("show")}),t.appendChild(a),appIndex++}});function unlockOS(){lockScreen.classList.add("hidden"),desktopScreen.classList.add("active")}passwordBox.addEventListener("click",()=>{passwordInput.focus()}),passwordInput.addEventListener("keydown",e=>{"Enter"===e.key&&unlockOS()}),passwordBox.addEventListener("dblclick",unlockOS),appsBtn.addEventListener("click",()=>{appDrawer.classList.toggle("open")}),closeWin.addEventListener("click",()=>{appWindow.classList.remove("show")}),lockBtn.addEventListener("click",()=>{appDrawer.classList.remove("open"),appWindow.classList.remove("show"),passwordInput.value="",desktopScreen.classList.remove("active"),lockScreen.classList.remove("hidden")});</script></body></html>
